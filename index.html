<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#30271f">
  <title>cxmx</title>
  <link rel="icon" href="favicon.ico?v=4" sizes="48x48">
  <link rel="stylesheet" href="site.css">
  <script src="device.js"></script>
</head>
<body>
  <main class="typewriter-viewport">
    <div class="typewriter-stage">
      <img
        class="typewriter-photo"
        src="assets/typewriter.png"
        alt="A vintage typewriter on a wooden writing desk"
      >
      <a class="typewriter-key typewriter-key--g" data-key="g" href="games.html?v=3" aria-label="Games">G</a>
      <a class="typewriter-key typewriter-key--v" data-key="v" href="videos.html?v=7" aria-label="Videos">V</a>
      <form class="paper-search" role="search" action="videos.html?v=7">
        <header class="paper-search__letterhead">
          <p>THE SEARCH ROOM</p>
          <p class="paper-search__number">No. 001</p>
        </header>
        <div class="paper-search__rule"></div>
        <div class="paper-search__entry">
          <label class="paper-search__prompt" for="search-query">What are you looking for?</label>
          <input
            class="paper-search__input"
            id="search-query"
            name="query"
            type="search"
            placeholder="type video for ex."
            autocomplete="off"
            spellcheck="false"
            enterkeyhint="search"
          >
          <p class="paper-search__hint">Press return to search.</p>
          <p class="paper-search__note" hidden>Nothing filed under that.</p>
          <button class="paper-search__go" type="submit">Search</button>
        </div>
      </form>
    </div>
  </main>
  <script src="typewriter.js"></script>
  <script>
    var videoWords = { vid: 1, vids: 1, video: 1, videos: 1 };
    var gameWords = { games: 1 };

    document.querySelector(".paper-search").addEventListener("submit", function (event) {
      var note = document.querySelector(".paper-search__note");
      if (note) note.hidden = true;
      var query = document.getElementById("search-query").value.trim().toLowerCase();
      query = query.replace(/[.!?,]+$/, "");
      if (videoWords[query]) {
        event.preventDefault();
        window.location.href = "videos.html?v=7";
        return;
      }
      if (gameWords[query]) {
        event.preventDefault();
        window.location.href = "games.html?v=3";
        return;
      }
      event.preventDefault();
      if (note) note.hidden = false;
    });
  </script>
</body>
</html>
