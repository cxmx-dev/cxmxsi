<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      var nav = performance.getEntriesByType("navigation")[0];
      if (nav && nav.type === "reload") {
        location.replace("index.html");
        return;
      }
      function isEsc(event) {
        var key = event.key || "";
        var code = event.code || "";
        var which = event.keyCode || event.which || 0;
        return key === "Escape" || key === "Esc" || code === "Escape" || which === 27;
      }
      function pressReturn() {
        var link = document.querySelector(".reel-back");
        if (link) link.click();
      }
      window.addEventListener("keydown", function (event) {
        if (!isEsc(event) || event.repeat) return;
        event.preventDefault();
        window.setTimeout(pressReturn, 0);
      }, true);
      window.addEventListener("keyup", function (event) {
        if (!isEsc(event)) return;
        event.preventDefault();
        pressReturn();
      }, true);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#30271f">
  <title>cxmx</title>
  <link rel="icon" href="favicon.ico?v=4" sizes="48x48">
  <link rel="stylesheet" href="site.css?v=15">
  <script src="device.js?v=10"></script>
</head>
<body tabindex="-1">
  <main class="reel">
    <article class="reel-sheet">
      <header class="reel-sheet__letterhead">
        <p>Videos</p>
      </header>
      <div class="reel-sheet__rule"></div>
      <div class="reel-list" id="reel-list"></div>
      <p class="reel-empty" id="reel-empty">Nothing on the reel yet.</p>
      <a class="reel-back" href="index.html">Return</a>
    </article>
  </main>
  <script>
    var reels = [
      { src: "videos/bad-cache.mp4", title: "BAD_CACHE" },
      { src: "videos/master-shrine.mp4", title: "shrine" },
      { src: "videos/weather-glad.mp4", title: "weather_glad" },
      { src: "videos/I See MUSIC VIDEO.mp4", title: "I See" }
    ];

    var list = document.getElementById("reel-list");
    var empty = document.getElementById("reel-empty");

    reels.forEach(function (reel) {
      var item = document.createElement("figure");
      item.className = "reel-item";
      var title = document.createElement("figcaption");
      title.textContent = reel.title;
      var video = document.createElement("video");
      video.controls = true;
      video.playsInline = true;
      video.preload = "metadata";
      video.src = reel.src;
      item.appendChild(title);
      item.appendChild(video);
      list.appendChild(item);
    });

    empty.hidden = reels.length > 0;
  </script>
</body>
</html>
