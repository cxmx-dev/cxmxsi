<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      var nav = performance.getEntriesByType("navigation")[0];
      if (nav && nav.type === "reload") {
        location.replace("index.html");
        return;
      }
      var leaving = false;
      function home(event) {
        var key = event.key || "";
        var code = event.code || "";
        var which = event.keyCode || event.which || 0;
        var isEsc = key === "Escape" || key === "Esc" || code === "Escape" || which === 27;
        if (!isEsc || event.repeat || leaving) return;
        leaving = true;
        location.replace("index.html");
      }
      window.addEventListener("keydown", home, true);
      window.addEventListener("keyup", home, true);
      document.addEventListener("focusin", function (event) {
        var target = event.target;
        if (!target || target.tagName !== "VIDEO") return;
        window.setTimeout(function () {
          target.blur();
          if (document.body) document.body.focus();
        }, 0);
      }, true);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#30271f">
  <title>Videos — The Search Room</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="stylesheet" href="site.css">
  <script src="device.js"></script>
</head>
<body tabindex="-1">
  <main class="reel">
    <article class="reel-sheet">
      <header class="reel-sheet__letterhead">
        <p>THE SEARCH ROOM</p>
        <p>Videos</p>
      </header>
      <div class="reel-sheet__rule"></div>
      <div class="reel-list" id="reel-list"></div>
      <p class="reel-empty" id="reel-empty">Nothing on the reel yet.</p>
      <a class="reel-back" href="index.html">Return</a>
    </article>
  </main>
  <script>
    var reels = [
      { src: "videos/bad-cache.mp4", title: "BAD_CACHE" },
      { src: "videos/master-shrine.mp4", title: "shrine" },
      { src: "videos/weather-glad.mp4", title: "weather_glad" }
    ];

    var list = document.getElementById("reel-list");
    var empty = document.getElementById("reel-empty");

    reels.forEach(function (reel) {
      var item = document.createElement("figure");
      item.className = "reel-item";
      var title = document.createElement("figcaption");
      title.textContent = reel.title;
      var video = document.createElement("video");
      video.controls = true;
      video.playsInline = true;
      video.preload = "metadata";
      video.src = reel.src;
      item.appendChild(title);
      item.appendChild(video);
      list.appendChild(item);
    });

    empty.hidden = reels.length > 0;
  </script>
</body>
</html>
